name: Tile Pack CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  build-tile-pack:
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.artifact-meta.outputs.artifact_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3 python3

      - name: Run T3/T4 regression build
        run: |
          ./scripts/build/t3_ci_regression.sh --output-root build/t3_regression_pack

      - name: Compute artifact name
        id: artifact-meta
        run: |
          TS="$(date -u +%Y%m%dT%H%M%SZ)"
          SHORT_SHA="${GITHUB_SHA::12}"
          echo "artifact_name=tile-pack-regression-${TS}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Upload generated pack artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact-meta.outputs.artifact_name }}
          path: build/t3_regression_pack
          if-no-files-found: error
          retention-days: 14

  download-and-verify-artifact:
    runs-on: ubuntu-latest
    needs: build-tile-pack

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3 python3

      - name: Download generated pack artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-tile-pack.outputs.artifact_name }}
          path: downloaded-pack

      - name: Verify downloaded artifact
        run: |
          PACK_ROOT="$(find downloaded-pack -type f -name metadata.json -print -quit | xargs dirname)"
          if [[ -z "$PACK_ROOT" || ! -d "$PACK_ROOT" ]]; then
            echo "Could not locate downloaded pack root" >&2
            exit 1
          fi
          ./scripts/build/t3_assert_tile_invariants.sh --pack-root "$PACK_ROOT"
